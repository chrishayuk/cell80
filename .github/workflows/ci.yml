name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Formatting is OS-independent — check it once.
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      # Lint every target — warnings fail the build. `--all-features` covers the cell VM.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      # The comparison benchmark is its own workspace (keeps wasmtime out of the lib build).
      - name: cell-bench builds
        run: cargo build --manifest-path cell-bench/Cargo.toml

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build the PyO3 binding wheel, install it + the MCP package, run the tests.
      # `--no-deps` for cell80-mcp: cell80-py is the local wheel (not on PyPI); chuk-mcp-server
      # is installed explicitly. The test resolves the cell library relative to its own path,
      # so no shell-specific env is needed (works on Windows bash too).
      - name: build cell80-py + run MCP tests
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest chuk-mcp-server
          maturin build -m cell80-py/Cargo.toml --release
          pip install cell80-py/target/wheels/cell80_py-*.whl
          pip install --no-deps ./cell80-mcp
          cd cell80-mcp && pytest -q
