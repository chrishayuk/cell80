name: publish-crates

# Publish the library + CLI crates to crates.io, in dependency order. Manual on purpose
# (publishing is permanent) — run it after bumping versions, with a `CARGO_REGISTRY_TOKEN`
# repo secret set. `cargo publish` waits for each crate to propagate before the next.
#
# cell80-py (PyO3 wheel → PyPI via maturin) and cell80-mcp (PyPI) are published separately;
# cell-bench is a benchmark, not published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish (dependency order — rustz80 depends on cell80-z80)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for p in cell80-z80 rustz80; do
            echo "::group::publish $p"
            cargo publish -p "$p"
            echo "::endgroup::"
          done
