# cell80 — a Z80 CPU core + a restricted-Rust → Z80 compiler + the cell micro-VM layer.
# Dependency arrow is strictly: cell80 -> rustz80 -> z80 (cell80 also uses z80 to run code).
# `rustz80` is a pure compiler; `cell80` is the cell layer (micro-VM, .cell cartridges, warm
# host, CellGraph, the `cell80` CLI) — a deterministic, sandboxed "executable tool capsule"
# on a flat-RAM Z80 with no ROM/ULA/I/O. `cell80-py` (PyO3) keeps its own workspace.
[workspace]
resolver = "2"
members = ["z80", "z80-tests", "rustz80", "cell80", "experiments/cell80-life", "experiments/cell-synth-evolve", "experiments/evolved-cells"]

[workspace.package]
edition = "2021"
# MSRV: the ed25519 chain (base64ct 1.8+) needs edition2024 support — cargo/rustc >= 1.85.
# Declared so an older toolchain gets a clean "requires rustc 1.85" instead of an opaque
# registry-parse error deep in the dependency tree.
rust-version = "1.85"
version = "0.8.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrishayuk/cell80"

# Keep release builds tight; the CPU core is hot.
[profile.release]
opt-level = 3
lto = "thin"
