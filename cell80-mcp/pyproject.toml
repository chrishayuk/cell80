[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell80-mcp"
version = "0.1.0"
description = "MCP server exposing a library of deterministic rustz80-cell micro-tools as LLM-drivable tools (search / inspect / run, over a warm host)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chuk-mcp-server>=0.25.6",
    "cell80-py",
]

[project.scripts]
cell80-mcp = "cell80_mcp.agent:main"

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cell80_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
