# cell80 — the cell micro-VM + tooling, built on the `rustz80` compiler and the `z80` core.
# Deterministic, sandboxed executable tool capsules (`.cell` cartridges): a compile-once /
# run-many runner + pool, a warm host + index, host-routed `CellGraph` composition, and the
# `cell80` CLI. `rustz80` stays a pure compiler; this crate is the cell layer that wraps it.
[package]
name = "cell80"
description = "Deterministic, sandboxed executable tool capsules for agents: a Z80 cell micro-VM, .cell cartridges, a warm host + index, and host-routed CellGraph composition — built on the rustz80 compiler."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["z80", "agents", "sandbox", "micro-vm", "tools"]
categories = ["emulators", "compilers"]

[dependencies]
rustz80 = { path = "../rustz80", version = "0.8.0" }
# The sibling machine bodies (WS-E3): the RV32 backend + executor, and the
# shared core's IR passes for the per-target compile pipeline.
rustrv32 = { path = "../rustrv32", version = "0.8.0" }
cell80-core = { path = "../cell80-core", version = "0.8.0" }
z80 = { package = "cell80-z80", path = "../z80", version = "0.8.0" }
serde_json = "1"
# The capability scan walks the parsed AST; the cell layer parses + cap-checks before
# handing the file to `rustz80::compile_file`.
syn = { version = "2", features = ["full", "visit"] }
# Content addressing + optional signing (roadmap 3.1): the artifact hash covers the
# serialized manifest + image; a signature (when present) covers the hash. A registry of
# executable artifacts invites poisoning — answered before anyone asks.
sha2 = "0.10"
ed25519-dalek = "2"

[[bin]]
name = "cell80"

# Throughput / latency benchmark for the cell runner (no criterion — a plain main).
[[bench]]
name = "cell"
harness = false

# The GPU batteries: tests/msl_battery.rs (macOS/Metal) and
# tests/cuda_battery.rs (`--features cuda`, NVIDIA boxes) run the library's
# cells on the GPU against the reference interpreter. rustmsl's codegen is
# portable, so the dep is unconditional; its Metal leg is cfg'd inside it.
[dev-dependencies]
rustmsl = { path = "../rustmsl", version = "0.8.0" }

[features]
# The CUDA gate (docs/16 runbook): builds everywhere (dynamic loading), runs
# on a box with an NVIDIA driver. Off by default — never in macOS CI's graph.
cuda = ["rustmsl/cuda"]

# gpu_interp_proto drives a custom bytecode-interpreter kernel + note-3 threadgroup
# dispatch directly (the megakernel-alternative under test) — lower-level than
# rustmsl's GpuBatch exposes, so the example needs Metal directly.
[target.'cfg(target_os = "macos")'.dev-dependencies]
metal = "0.29"
