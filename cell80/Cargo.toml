# cell80 — the cell micro-VM + tooling, built on the `rustz80` compiler and the `z80` core.
# Deterministic, sandboxed executable tool capsules (`.cell` cartridges): a compile-once /
# run-many runner + pool, a warm host + index, host-routed `CellGraph` composition, and the
# `cell80` CLI. `rustz80` stays a pure compiler; this crate is the cell layer that wraps it.
[package]
name = "cell80"
description = "Deterministic, sandboxed executable tool capsules for agents: a Z80 cell micro-VM, .cell cartridges, a warm host + index, and host-routed CellGraph composition — built on the rustz80 compiler."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["z80", "agents", "sandbox", "micro-vm", "tools"]
categories = ["emulators", "compilers"]

[dependencies]
rustz80 = { path = "../rustz80", version = "0.7.0" }
z80 = { package = "cell80-z80", path = "../z80", version = "0.7.0" }
serde_json = "1"
# The capability scan walks the parsed AST; the cell layer parses + cap-checks before
# handing the file to `rustz80::compile_file`.
syn = { version = "2", features = ["full", "visit"] }

[[bin]]
name = "cell80"

# Throughput / latency benchmark for the cell runner (no criterion — a plain main).
[[bench]]
name = "cell"
harness = false
