# Cell80 Life: a minimal grid-world prototype where organism behaviour is driven by real
# `.cell` cartridges (compiled from the existing cell80 stdlib), not plain Rust closures.
# Design/status notes: ../cell80-life.md — speculative, not on the cell80 roadmap.
[package]
name = "cell80-life"
description = "Experiment: organisms driven by real .cell cartridges as genes/promoters."
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
cell80 = { path = "../../cell80" }
cell80-core = { path = "../../cell80-core" }
rustz80 = { path = "../../rustz80" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }

# EX-0's GPU body (experiments/deterministic-ecology.md) — the codegen builds everywhere,
# the Metal executor only exists where Metal does.
[target.'cfg(target_os = "macos")'.dependencies]
rustmsl = { path = "../../rustmsl" }
