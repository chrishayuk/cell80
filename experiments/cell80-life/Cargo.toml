# Cell80 Life: a minimal grid-world prototype where organism behaviour is driven by real
# `.cell` cartridges (compiled from the existing cell80 stdlib), not plain Rust closures.
# Design/status notes: ../cell80-life.md — speculative, not on the cell80 roadmap.
[package]
name = "cell80-life"
description = "Experiment: organisms driven by real .cell cartridges as genes/promoters."
publish = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
cell80 = { path = "../../cell80" }
cell80-core = { path = "../../cell80-core" }
rustz80 = { path = "../../rustz80" }
# Unconditional, not macOS-gated: rustmsl's codegen/`interp` module (`linearize`/`cpu_run`,
# EX-2 operator (b)'s structural+viability gates) build on every platform — rustmsl only
# macOS-gates its own `metal` dependency internally (`mod gpu`, `GpuBatch`/`InterpBatch`),
# not the crate as a whole.
rustmsl = { path = "../../rustmsl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
