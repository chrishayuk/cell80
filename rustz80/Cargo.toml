# rustz80 (spec 07): a restricted Rust -> Z80 compiler. Stage 0 — syn frontend,
# own IR, naive Z80 codegen for u16 arithmetic + if/while; differential-tested
# against rustc on the emulator. Not an LLVM backend, no real `core`.
[package]
name = "rustz80"
description = "A restricted Rust -> Z80 compiler: the dialect is also real Rust; emits a bootable .tap. The cell micro-VM that runs the output lives in the `cell80` crate."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["z80", "compiler", "spectrum", "codegen", "retro"]
categories = ["compilers", "emulators"]

[dependencies]
# The target-independent core: typed IR, passes, the reference interpreter, and the
# target descriptors (Phase 5 A5) — this crate is backend zero on top of it.
cell80-core = { version = "0.8.0", path = "../cell80-core" }
# Otherwise dependency-free apart from the `syn` frontend (`quote` is syn's own
# printing half, already in the tree — the canon pass re-emits transformed items with it).
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"

[dev-dependencies]
# Run the compiled bytes on the real CPU to differential-test against rustc.
z80 = { package = "cell80-z80", version = "0.8.0", path = "../z80" }
# The RV32 sibling backend: the diff battery drives it through the same rustc
# oracle (WS-B/B3 — same source, second ISA, one truth).
rustrv32 = { path = "../rustrv32" }
# The F2 transcendental golden bank (tests/data/f32_trans_golden.json) — the
# accuracy harness parses the offline-MPFR tables with it.
serde_json = "1"
# The ROM-gated `.tap` boot test lives in `chuk-speccy` (where the full Spectrum +
# ROM are) and depends on this crate — it tests compiled output on the real machine.
