[package]
name = "z80-tests"
description = "SingleStepTests JSON harness + ZEX runner for the z80 core."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
z80 = { package = "cell80-z80", path = "../z80" }

[dev-dependencies]
# The SingleStepTests harness (tests/single_step.rs) parses the per-opcode JSON vectors.
serde_json = "1"
